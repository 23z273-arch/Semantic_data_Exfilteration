version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dlp_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/sdlp.db
      - EMBEDDING_PROVIDER=local  # Falls back to local SentenceTransformers automatically if API Key not provided
      - LLM_PROVIDER=mock
      - FRONTEND_URL=http://localhost:3000
    volumes:
      - backend_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dlp_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  backend_data:
